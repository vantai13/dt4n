[pytest]
testpaths = test tests
python_files = test_*.py
norecursedirs = legacy .git .pytest_cache __pycache__ node_modules dashboard
markers =
    live: can root + Mininet + kernel module htb/netem/bfifo
    slow: longer-running statistical positive controls
    custody: kiem soat luu giu du lieu ngoai git tren may tac gia; khong kha chuyen

# Mac dinh BO QUA `slow` va `custody`. `custody` chi co nghia tren may tac
# gia giu parquet ngoai git; chay rieng bang `pytest -m custody`.
# Ly do bo `slow` (do duoc 2026-08-20, `-k phase23 --durations`):
#     test_C13_mc_criterion_has_two_separate_propositions   499.6 s
#     test_C11_B200_is_unstable                              24.2 s
#     test_A18_mc_error_shrinks_...                           9.0 s
#   -> ba test chiem 533 s / 748 s = 71% cua ca bo, deu la doi chung Monte-Carlo
#      hoi tu, khong phai doi chung ve tinh dung.
#
# Mot bo test 12 phut se KHONG duoc chay truoc moi commit, va mot test khong
# duoc chay la mot test khong ton tai (NT-v2-12 ap cho test).
#
# Phan cong:
#     local, truoc commit :  pytest                 -> nhanh, portable
#     custody tac gia     :  pytest -m custody
#     day du               :  pytest -m ""          -> chay TAT CA
#     chi phan cham        :  pytest -m slow
#     CI                   :  .github/workflows/tests.yml chay
#                             `pytest test/ -q -m "not live and not custody"`.
#                             `-m` tren dong lenh GHI DE addopts, nen CI VAN
#                             chay `slow` nhung KHONG doi hoi du lieu local.
#                             Do la chu y: nhanh o local, day du o CI.
addopts = -m "not slow and not custody"
