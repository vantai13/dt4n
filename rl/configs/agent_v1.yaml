# rl/configs/agent_v1.yaml
# Cau hinh agent Phase 6 — TOI GIAN CO CHU DICH.
# Double + Dueling BAT; PER/softmax/entropy TAT (giu code, bat khi 6.4 can).

agent:
  # --- kien truc mang ---
  hidden_layers: [128, 64]
  device: cpu                 # mang be, CPU du va tai lap de hon GPU

  # --- 3 co ablation (6.6 se bat/tat) ---
  use_double: true            # Double DQN — GIU (re, chong overestimation)
  use_dueling: true           # Dueling   — GIU (drop-in)
  exploration: epsilon_greedy # 'softmax' chi bat neu 6.4 thay policy collapse

  # --- hyperparameter hoc ---
  gamma: 0.99                 # reward phuc hoi cuoi episode van co suc hut
  learning_rate: 0.001        # 1e-3 cho CartPole; se ha ~5e-4 cho TwinEnv (chot o 6.4)
  batch_size: 64
  buffer_capacity: 50000
  target_update_freq: 500     # copy main->target moi 500 buoc

  # --- lich epsilon (khai pha -> khai thac) ---
  epsilon_start: 1.0
  epsilon_end: 0.05
  epsilon_decay: 0.995        # giam dan sau moi episode

  # --- tham so softmax (NGU DONG — chi dung khi exploration: softmax) ---
  temp_start: 2.0
  temp_end: 0.1
  temp_decay: 0.9985