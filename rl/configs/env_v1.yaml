# DT4N Env v1 timing freeze after Phase 5 delta checks.
# State/reward are not frozen here; V5/V6 still own MDP/reward decisions.

version: env_v1
status: delta_frozen
frozen_at_commit: pending_commit

timing:
  period_s: 0.5
  delta_s: 1.80
  delta_criterion: t_50_rise_time
  delta_formula: "t50_p95 + period + snapshot_span_p95 + margin"
  delta_components:
    t50_p95_s: 0.845
    period_s: 0.500
    snapshot_span_p95_s: 0.144
    margin_s: 0.300
  delta_source: docs/phase-5/artifacts/delta_final.json
  delta_gate_source: docs/phase-5/artifacts/delta_final_gate.json
  delta_n_trials: 20
  delta_note: >
    Screening n=5 gave delta around 1.58s. Confirmation n=20 gave
    delta around 1.80s; use the n=20 value to avoid optional stopping.
  delta_scaling_rule: remeasure_per_period_and_delay
  delta_scaling_source: docs/phase-5/artifacts/phase_vs_ramp_analysis.json
  delta_scaling_note: >
    At period=0.5, sample index is phase-dominated, but t50 has high spread.
    rate_before does not explain t50. Do not extrapolate a single pure formula
    for Phase 7 D5/D2; remeasure delta for changed sync period or RTT.
  t_max_steps: 15
  t_max_status: pending_oracle_measurement
  t_max_rule: "p95(oracle steps_to_terminate over 50 seeds) + 5"
  t_max_note: >
    env_v0 used 30. Use 15 as the temporary cap because oracle_plan() returns
    one recovery action and long episodes can create reward-hacking pressure.

read_path:
  mode: direct_get
  n_things: 17
  snapshot_span_p95_s: 0.144
  source: docs/phase-5/raw/bench_reader_snapshot.txt
  rejected_alternative: search
  rejection_source: docs/phase-5/raw/search_vs_direct.txt
  rejection_reason: >
    Search has lower p95 but a heavy max tail and returns 19 Things instead of
    the 17-Thing observation contract: org.dt4n:controller and
    org.dt4n:link-h1-srv1 are extra.

collector:
  cycle_elapsed_p95_s: 0.127
  duty_cycle_p95: 0.254
  duty_gate: "<= 0.80"
  gate_status: pass
  source: docs/phase-5/raw/cycle_gate_p05.json

traffic:
  sat_mode: tcp
  udp_hypothesis: rejected
  udp_rejection_evidence: docs/phase-5/artifacts/delta_variant_summary.json
  caveat: >
    TCP-vs-UDP conclusion is tied to the measured RTT. Recheck when Phase 7
    changes delay/RTT.

command:
  ditto_fire_and_forget_timeout_ms: 1
  http_202_means: message_accepted_only
  ack_mode: async_from_flow_log
  ack_impl: rl.flow_ack.FlowLogTail.verdict
  ack_timeout_s: 0.3
  ack_unit_test: test/test_flow_ack.py
  ack_live_probe: docs/phase-5/raw/flow_ack_command_only_probe.json
  replay_buffer_action: action_requested
  action_executed_source: info.action_executed
  whitelist_intact: true
  whitelist_evidence: docs/phase-5/raw/whitelist_probe.json

noise:
  robust_sigma_mbps: 0.0694
  sigma_estimator: "1.4826 * MAD"
  sigma_condition: saturated_tcp_no_fault
  change_frac: 0.5
  source: docs/phase-5/artifacts/rate_noise_final.json

state:
  dims: 45
  state_builder: rl.state_builder_draft
  known_gap_loss: >
    No per-link loss in v1. V5 must test whether TrafficFlood cases not on the
    h1->srv1 probe path still move at least one state dimension by >3 sigma.

budget:
  hard_every: 20
  reset_avg_est_s: 13.7
  avg_steps_est: 12
  sec_per_episode_est: 35.3
  train_hours_300ep_5seed: 14.7
  train_hours_with_3way_ablation: 44.1
