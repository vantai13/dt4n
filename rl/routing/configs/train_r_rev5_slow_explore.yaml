# Rev5 follow-up config: same routing DQN setup, slower epsilon decay.
#
# Use only if the 5000-episode run with train_r_v1 still has unstable
# safe_delta/path diversity. The purpose is to test whether early greedy
# lock-in is causing static-looking policies.

version: train_r_rev5_slow_explore

agent:
  hidden_layers: [64, 32]
  device: cpu

  use_double: true
  use_dueling: true
  exploration: epsilon_greedy

  gamma: 0.95
  learning_rate: 0.001
  batch_size: 64
  buffer_capacity: 20000
  target_update_freq: 200

  epsilon_start: 1.0
  epsilon_end: 0.05
  epsilon_decay: 0.9985

  temp_start: 2.0
  temp_end: 0.1
  temp_decay: 0.9985

train:
  episodes: 5000
  warmup_steps: 500
  eval_every: 25
  z_steps_choices: [0, 1, 3, 5, 8, 12]
  mask_aoi: false

env:
  max_steps: 15
  load_cfg: LOAD_CFG_TRAIN

seeds:
  train_seed_start: 1000
  train_seed_stride: 100000
  val_seed_start: 500
  val_seeds: 20
  heldout_seed_start: 2000
  heldout_seeds: 50
